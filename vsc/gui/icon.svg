<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- VideoSpeedControl: a film frame with a play triangle and a slow-motion dial -->
  <rect x="16" y="40" width="224" height="176" rx="28" fill="#1f2a36"/>
  <g fill="#3b4a5c">
    <rect x="30" y="54" width="18" height="14" rx="3"/><rect x="30" y="86" width="18" height="14" rx="3"/>
    <rect x="30" y="118" width="18" height="14" rx="3"/><rect x="30" y="150" width="18" height="14" rx="3"/>
    <rect x="30" y="182" width="18" height="14" rx="3"/>
    <rect x="208" y="54" width="18" height="14" rx="3"/><rect x="208" y="86" width="18" height="14" rx="3"/>
    <rect x="208" y="118" width="18" height="14" rx="3"/><rect x="208" y="150" width="18" height="14" rx="3"/>
    <rect x="208" y="182" width="18" height="14" rx="3"/>
  </g>
  <!-- motion trail: three fading copies of the play triangle -->
  <path d="M70 92 L110 128 L70 164 Z" fill="#3498db" opacity="0.25"/>
  <path d="M86 92 L126 128 L86 164 Z" fill="#3498db" opacity="0.5"/>
  <path d="M104 86 L152 128 L104 170 Z" fill="#3498db"/>
  <!-- dial -->
  <circle cx="176" cy="172" r="38" fill="#f1c40f" stroke="#1f2a36" stroke-width="8"/>
  <path d="M176 172 L176 146" stroke="#1f2a36" stroke-width="8" stroke-linecap="round"/>
  <path d="M176 172 L194 182" stroke="#1f2a36" stroke-width="8" stroke-linecap="round"/>
</svg>
